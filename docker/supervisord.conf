[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:mariadb]
command=/usr/bin/mysqld_safe --datadir=/var/lib/mysql
user=mysql
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb-error.log

[program:apache2]
command=/usr/sbin/apachectl -D FOREGROUND
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/apache.log
stderr_logfile=/var/log/supervisor/apache-error.log
